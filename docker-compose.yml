services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: perf_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - perf-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d perf_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-seed:
    image: postgres:15-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: password
    volumes:
      - ./db/seed.sql:/seed.sql:ro
    command: ["psql", "-h", "db", "-U", "user", "-d", "perf_db", "-f", "/seed.sql"]
    networks:
      - perf-network

  laravel-api:
    build: ./laravel-app
    ports:
      - "8001:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    networks:
      - perf-network

  django-api:
    build: ./django-app
    ports:
      - "8002:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    networks:
      - perf-network

  k6:
    image: grafana/k6:latest
    profiles:
      - tools
    volumes:
      - ./scripts:/scripts
    networks:
      - perf-network
    entrypoint: ["k6"]

volumes:
  pgdata:

networks:
  perf-network:
    driver: bridge
